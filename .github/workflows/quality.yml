name: Quality checks
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: binspa_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: binspa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U binspa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      TEST_LOYALTY_POSTGRES_URL: postgresql://binspa_test:isolated-test-password@127.0.0.1:5432/binspa_test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci --no-fund
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - run: node --test tests/*.test.cjs
      - run: python -m pytest -q --disable-warnings
      - run: python tests/operations_browser_check.py
      - run: python tests/phase4_browser_check.py
      - run: python tests/phase5_browser_check.py
      - run: python tests/booking_catalog_browser_check.py
      - run: python tests/phase6_browser_check.py
      - run: python tests/ai_chat_navigation_browser_check.py
      - run: python tests/staff_security_browser_check.py
      - run: python tests/admin_care_browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-screenshots
          path: |
            .test-tmp/operations-browser-*/*.png
            .test-tmp/phase4-browser-*/*.png
            .test-tmp/phase5-browser-*/*.png
            .test-tmp/booking-catalog-*/*.png
            .test-tmp/phase6-browser-*/*.png
            .test-tmp/ai-chat-navigation-*/*.png
            .test-tmp/staff-security-browser-*/*.png
            .test-tmp/admin-care-browser-*/*.png
